# Churn is expressed monthly and converted to a daily hazard in code.
# Per-customer parameters are drawn around these means (gamma / beta),
# with 'dispersion' controlling overlap between customers of a segment.
segments:
  loyal_high_spender:
    share: 0.08
    orders_per_month: 1.2
    price_sensitivity: 0.15
    discount_response: 0.2
    abandon_propensity: 0.45
    items_per_order: [2, 3]
    category_affinity: {broad: true, price_tier_bias: premium}
    churn_monthly_prob: 0.005
    delivery_sensitivity: high
    dispersion: 0.35
  bargain_hunter:
    share: 0.27
    orders_per_month: 0.5
    price_sensitivity: 0.85
    discount_response: 0.9          # concentrated in promo windows
    abandon_propensity: 0.78
    items_per_order: [1, 2]
    category_affinity: {focus: [essentials], price_tier_bias: budget}
    churn_monthly_prob: 0.04
    delivery_sensitivity: medium
    dispersion: 0.40
  gift_buyer:
    share: 0.20
    orders_per_month: 0.12
    price_sensitivity: 0.40
    discount_response: 0.5
    abandon_propensity: 0.65
    items_per_order: [1, 2]
    category_affinity: {focus: [beauty, toys, home, jewelry]}
    seasonal_peaks: [valentines, mothers_day, christmas]
    churn_monthly_prob: 0.06
    delivery_sensitivity: medium
    dispersion: 0.45
  one_time_buyer:
    share: 0.30
    orders_per_month: 0.05
    p_repeat_after_first: 0.15      # ~85% never return
    price_sensitivity: 0.50
    discount_response: 0.5
    abandon_propensity: 0.70
    items_per_order: [1, 1]
    category_affinity: {random: true}
    churn_monthly_prob: 0.10
    delivery_sensitivity: high
    dispersion: 0.50
  seasonal_shopper:
    share: 0.15
    orders_per_month: 0.10          # off-season
    window_orders_per_month: 1.0    # during buen_fin, hot_sale, christmas
    price_sensitivity: 0.70
    discount_response: 0.9
    abandon_propensity: 0.72
    items_per_order: [1, 3]
    category_affinity: {focus: [electronics, home]}
    churn_monthly_prob: 0.01        # dormant is NOT churned
    delivery_sensitivity: low
    dispersion: 0.40
migration:
  share_of_customers: 0.04
  rule: "bargain_hunter -> loyal after >=3 on-time orders"